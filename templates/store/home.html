{% load static %}
{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>

/* ================================================================
   BOCA MANIA v5.0 - CYBER-INDUSTRIAL ARCHITECTURE
================================================================ */

:root {
    --xeneize-blue-core: #071526;
    --xeneize-blue-dark: #030a14;
    --xeneize-gold-neon: #FFD700;
    --xeneize-gold-burn: #b39700;
    --cyber-white: #f5f7fa;
    --neon-glow: 0 0 25px rgba(255, 215, 0, 0.45);
    --glass-panel: rgba(7, 21, 38, 0.75);
    --cyber-border: 1px solid rgba(255, 215, 0, 0.15);
    --curve-factor: 12px;
    --transition-sharp: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ================================================================
   GLOBAL OVERRIDES
================================================================ */

nav:not(.cyber-nav),
.navbar,
header,
footer {
    display: none !important;
}

body {
    background-color: var(--xeneize-blue-dark);
    color: var(--cyber-white);
    font-family: 'Space Grotesk', sans-serif;
    margin: 0;
    padding: 0;
    overflow-x: hidden;

    background-image:
        radial-gradient(circle at 10% 20%, rgba(11, 31, 58, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 40%);
}

/* ================================================================
   CYBER NAV
================================================================ */

.cyber-nav {
    display: flex !important;
    background: rgba(3, 10, 20, 0.9);
    backdrop-filter: blur(12px);
    padding: 0 4%;
    height: 80px;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--xeneize-gold-neon);
    position: sticky;
    top: 0;
    z-index: 99999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.cyber-logo {
    font-family: 'Syncopate', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--cyber-white);
    text-decoration: none;
    letter-spacing: 5px;
}

.cyber-logo span {
    color: var(--xeneize-gold-neon);
    text-shadow: var(--neon-glow);
}

/* ================================================================
   HERO
================================================================ */

.cyber-hero {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    min-height: calc(100vh - 80px);
}

.hero-text-panel {
    padding: 8% 8% 8% 6%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.hero-video-wrapper {
    position: relative;
    background: #000;
    overflow: hidden;
}

.hero-video-wrapper video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.65;
}

/* ================================================================
   CATALOG
================================================================ */

.matrix-catalog-section {
    padding: 100px 4%;
    border-bottom: var(--cyber-border);
}

.catalog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 30px;
}

.catalog-item-card {
    background: var(--xeneize-blue-core);
    border: var(--cyber-border);
    transition: var(--transition-sharp);
}

/* ================================================================
   VAULT
================================================================ */

.vault-chronicles-section {
    padding: 100px 4%;
}

/* ================================================================
   IDOLS
================================================================ */

.idol-grid {
    display: flex;
    flex-direction: column;
    gap: 60px;
}

/* ================================================================
   MAP
================================================================ */

.templo-map-section {
    background-color: #030a14;
    padding: 40px 20px;
}

</style>

<!-- ================================================================
   NAV
================================================================ -->

<nav class="cyber-nav">
    <a href="/" class="cyber-logo">BOCA<span>MANIA</span></a>

    <div class="cyber-nav-links">
        <div class="tech-dropdown">
            <span class="tech-drop-trigger">// ACCESS</span>

            <div class="tech-drop-menu">
                <a href="/register">Create Account</a>
                <a href="{% url 'admin_dashboard' %}">System Admin</a>
                <a href="{% url 'user_login' %}">Member Login</a>
            </div>
        </div>

        <a href="/products">Store</a>
        <a href="/cart">Cart</a>
    </div>
</nav>

<!-- ================================================================
   HERO SECTION
================================================================ -->

<section class="cyber-hero">

    <div class="hero-text-panel">
        <span class="cyber-tag">// THE WORLD OF THE XENEIZES</span>

        <h1 class="cyber-main-title">
            WEAR THE <em>DNA</em> OF GLORY
        </h1>

        <p class="cyber-abstract">
            More than an ecommerce...
        </p>
    </div>

    <div class="hero-video-wrapper">
        <video id="stadiumPlayer" autoplay muted loop playsinline>
            <source src="{% static 'store/videos/boca.mp4' %}" type="video/mp4">
        </video>

        <div class="video-hud-overlay">
            <button onclick="vidEngine('play')" class="cyber-hud-btn">PLAY</button>
            <button onclick="vidEngine('pause')" class="cyber-hud-btn">PAUSE</button>
            <button onclick="vidEngine('mute')" class="cyber-hud-btn">MUTE</button>
        </div>
    </div>

</section>

<!-- ================================================================
   RESTO DO SEU HTML (CATALOG + VAULT + IDOLS + MAP)
   👉 MANTIDO COMPLETO NO SEU ARQUIVO ORIGINAL
================================================================ -->

<!-- ================================================================
   SCRIPTS
================================================================ -->

<script>

function vidEngine(action) {
    const mainVid = document.getElementById('stadiumPlayer');
    if (!mainVid) return;

    if (action === 'play') mainVid.play();
    if (action === 'pause') mainVid.pause();
    if (action === 'mute') mainVid.muted = !mainVid.muted;
}

function vaultEngine(action, videoId) {
    const vid = document.getElementById(videoId);
    if (!vid) return;

    if (action === 'play') vid.play();
    if (action === 'pause') vid.pause();
    if (action === 'mute') vid.muted = !vid.muted;
}

</script>

{% endblock %}
