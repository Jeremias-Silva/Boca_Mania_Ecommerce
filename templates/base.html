{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boca Mania Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* NAVBAR */
        .navbar {
            background: #0b1f3a;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #FFD700;
        }

        /* Destaque para o link ativo (Dashboard) */
        .navbar a.active {
            color: #FFD700;
            border-bottom: 2px solid #FFD700;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
        }

        .container {
            padding: 20px;
        }

        .btn {
            background: #FFD700;
            color: #0b1f3a;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: white;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">BOCA MANIA</div>

    <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'product_list' %}">Store</a>
        <a href="{% url 'cart' %}">Cart</a>

        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="active">Dashboard</a>
            <a href="{% url 'logout' %}">Logout</a>

        {% endif %}
    </div>
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
