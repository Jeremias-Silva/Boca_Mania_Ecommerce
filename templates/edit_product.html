{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
    /* ================================================================
       BOCAMANIA v5.0 - CYBER-INDUSTRIAL ARCHITECTURE (PRODUCT EDIT)
       ================================================================
    */

    :root {
        --xeneize-blue-core: #071526;
        --xeneize-blue-dark: #030a14;
        --xeneize-gold-neon: #FFD700;
        --xeneize-gold-burn: #b39700;
        --cyber-white: #f5f7fa;
        --gray-telemetry: #718096;
        --neon-glow: 0 0 25px rgba(255, 215, 0, 0.45);
        --cyber-border: 1px solid rgba(255, 215, 0, 0.15);
        --transition-sharp: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Global Dynamic System Reset Overrides */
    nav:not(.cyber-nav), .navbar, header, footer { display: none !important; }

    body {
        background-color: var(--xeneize-blue-dark);
        color: var(--cyber-white);
        font-family: 'Space Grotesk', sans-serif;
        margin: 0;
        padding: 0;
        background-image: 
            radial-gradient(circle at 50% 0%, rgba(11, 31, 58, 0.2) 0%, transparent 50%);
    }

    /* HUD NAVBAR */
    .cyber-nav {
        display: flex !important;
        background: rgba(3, 10, 20, 0.9);
        backdrop-filter: blur(12px);
        padding: 0 4%;
        height: 80px;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--xeneize-gold-neon);
        position: sticky;
        top: 0;
        z-index: 99999;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .cyber-logo {
        font-family: 'Syncopate', sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--cyber-white);
        text-decoration: none;
        letter-spacing: 4px;
    }

    .cyber-logo span {
        color: var(--xeneize-gold-neon);
        text-shadow: var(--neon-glow);
    }

    .btn-cyber-back {
        background: transparent;
        color: var(--cyber-white);
        padding: 10px 20px;
        font-family: 'Syncopate', sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: var(--transition-sharp);
        letter-spacing: 1px;
    }

    .btn-cyber-back:hover {
        border-color: var(--xeneize-gold-neon);
        color: var(--xeneize-gold-neon);
        box-shadow: var(--neon-glow);
    }

    /* ADVANCED CONFIGURATOR CARD CONTAINER */
    .edit-container {
        width: 100%;
        max-width: 850px;
        margin: 60px auto;
        padding: 55px;
        background: var(--xeneize-blue-core);
        border: var(--cyber-border);
        box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        position: relative;
        box-sizing: border-box;
        transition: var(--transition-sharp);
    }

    .edit-container:hover {
        border-color: var(--xeneize-gold-neon);
        box-shadow: var(--neon-glow);
    }

    .edit-title {
        font-family: 'Syncopate', sans-serif;
        font-size: 26px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 45px;
        letter-spacing: 2px;
        color: var(--cyber-white);
    }

    .edit-title span {
        color: var(--xeneize-gold-neon);
        text-shadow: var(--neon-glow);
    }

    /* DYNAMIC DJANGO FORM INJECTION RULES (form.as_p TARGETING) */
    form p {
        margin-bottom: 25px;
        display: flex;
        flex-direction: column;
    }

    label {
        display: block;
        font-family: 'Syncopate', sans-serif;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #a0aec0;
        margin-bottom: 10px;
    }

    /* DYNAMIC DOM ELEMENTS INTERFACE STYLING */
    input, textarea, select {
        width: 100%;
        padding: 15px 18px;
        background: rgba(3, 10, 20, 0.6);
        border: 1px solid rgba(255, 215, 0, 0.15);
        color: var(--cyber-white);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 16px;
        outline: none;
        box-sizing: border-box;
        transition: var(--transition-sharp);
    }

    input:focus, textarea:focus, select:focus {
        border-color: var(--xeneize-gold-neon);
        background: rgba(7, 21, 38, 0.9);
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
    }

    /* File Ingestion System Overrides */
    input[type="file"] {
        background: transparent;
        border: 1px dashed rgba(255, 215, 0, 0.3);
        padding: 20px;
        cursor: pointer;
        font-size: 14px;
        color: var(--gray-telemetry);
    }

    /* Matrix Checkboxes Mapping */
    input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
        accent-color: var(--xeneize-gold-neon);
        align-self: flex-start;
        margin-top: 5px;
    }

    /* PIPELINE ACTION ARRAY ARRAY */
    .actions {
        display: flex;
        gap: 15px;
        margin-top: 40px;
    }

    .btn {
        flex: 1;
        padding: 18px;
        border: none;
        font-family: 'Syncopate', sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        cursor: pointer;
        transition: var(--transition-sharp);
        letter-spacing: 1.5px;
        box-sizing: border-box;
    }

    /* STATE CONTROLS */
    .save {
        background: var(--xeneize-gold-neon);
        color: var(--xeneize-blue-dark);
    }

    .save:hover {
        background: var(--cyber-white);
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }

    .publish {
        background: transparent;
        border: 1px solid #00ff66;
        color: #00ff66;
    }

    .publish:hover {
        background: #00ff66;
        color: var(--xeneize-blue-dark);
        box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
    }

    .draft {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: var(--gray-telemetry);
    }

    .draft:hover {
        border-color: var(--cyber-white);
        color: var(--cyber-white);
    }

    /* ADAPTIVE ARCHITECTURE RESPONSIVENESS */
    @media (max-width: 768px) {
        .cyber-nav { height: auto; padding: 20px 4%; flex-direction: column; gap: 15px; }
        .edit-container { padding: 40px 25px; }
        .edit-title { font-size: 20px; text-align: center; }
        .actions { flex-direction: column; gap: 12px; }
        .btn { width: 100%; }
    }
</style>

<nav class="cyber-nav">
    <a href="{% url 'admin_dashboard' %}" class="cyber-logo">
        EDIT<span>PRODUCT</span>
    </a>
    <a href="{% url 'admin_dashboard' %}" class="btn-cyber-back">
        // Back
    </a>
</nav>

<div class="edit-container">

    <div class="edit-title">
        Modify <span>Product</span>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="actions">
            <button type="submit" name="action" value="save" class="btn save">
                SAVE
            </button>

            <button type="submit" name="action" value="publish" class="btn publish">
                PUBLISH
            </button>

            <button type="submit" name="action" value="draft" class="btn draft">
                DRAFT
            </button>
        </div>

    </form>

</div>
{% endblock %}
